<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIGALI MARKET PLATFORM | Kigali Marketplace & Gasabo Real Estate (kigalimarket.com)</title>
  <meta name="description" content="KIGALI MARKET PLATFORM - Official portal for Kigali Marketplace peer-to-peer trading and Gasabo Real Estate luxury estate developments and commercial property in Rwanda.">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Preloader styling */
    #app-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #032202;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      z-index: 9999;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(237, 162, 3, 0.2);
      border-top-color: #EDA203;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.25rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="header-mount"></div>

  <main class="main-wrapper" id="app">
    <div id="app-loading">
      <div class="spinner"></div>
      <h2 style="font-weight: 700; letter-spacing: -0.02em;">Loading KIGALI MARKET PLATFORM...</h2>
      <p style="font-size: 0.88rem; color: #F4EDE2; margin-top: 0.25rem;">Connecting Kigali Marketplace & Gasabo Real Estate (kigalimarket.com)</p>
    </div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
