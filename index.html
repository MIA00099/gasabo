<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Kept under ~60 characters: Bing and Google both truncate the title in
       results past roughly that, and Bing's URL Inspection flagged the old
       83-character one as "Title too long". Brand first, then what the site
       is and where. -->
  <title>Kigali Market | Buy &amp; Sell Products &amp; Property in Rwanda</title>
  <!-- ~150 characters. The old one was 223, which Bing flagged as too long -
       it gets cut off in the result and the tail is wasted. -->
  <meta name="description" content="Kigali Market is Rwanda's online marketplace - buy and sell products, vehicles and property, or post a free ad. Plus Gasabo Real Estate: houses &amp; plots.">

  <!-- Site-wide branding for search engines and social scrapers.
       Product and property pages override the title/description/og:* below
       with their own, injected server-side (see server/src/seo/meta.ts); this
       is what every other route - the homepage above all - carries. Before
       this, the homepage was an SPA shell with a title but no canonical, no
       Open Graph and no structured data, which is the thinnest a brand's most
       important page can be. -->
  <link rel="canonical" href="https://www.kigalimarket.com/">
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Kigali Market">
  <meta property="og:title" content="Kigali Market - Buy & Sell in Rwanda | kigalimarket.com">
  <meta property="og:description" content="Rwanda's online marketplace to buy and sell products, vehicles and property. Post a free ad or find what you need, plus Gasabo Real Estate.">
  <meta property="og:url" content="https://www.kigalimarket.com/">
  <meta property="og:image" content="https://www.kigalimarket.com/logo-kigali-market.jpg">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Kigali Market - Buy & Sell in Rwanda">
  <meta name="twitter:description" content="Rwanda's online marketplace to buy and sell products, vehicles and property. Post a free ad or find what you need.">
  <meta name="twitter:image" content="https://www.kigalimarket.com/logo-kigali-market.jpg">

  <!-- Structured data: tells Google this is a named organisation and a
       searchable website, which is what a search for the brand name needs to
       resolve to this site rather than to nothing. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://www.kigalimarket.com/#organization",
        "name": "Kigali Market",
        "url": "https://www.kigalimarket.com/",
        "logo": "https://www.kigalimarket.com/logo-kigali-market.jpg",
        "description": "Rwanda's online marketplace for buying and selling products, vehicles and property, and the Gasabo Real Estate portal.",
        "areaServed": "RW"
      },
      {
        "@type": "WebSite",
        "@id": "https://www.kigalimarket.com/#website",
        "url": "https://www.kigalimarket.com/",
        "name": "Kigali Market",
        "publisher": { "@id": "https://www.kigalimarket.com/#organization" },
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.kigalimarket.com/?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    ]
  }
  </script>

  <link rel="icon" type="image/jpeg" href="/logo-kigali-market.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Icon set used throughout the delivered mockups (nmm/*.html). -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Preloader styling */
    #app-loading {
      position: fixed;
      /* inset rather than 100vw/100vh: 100vw is the viewport INCLUDING the
         scrollbar, so this splash was a scrollbar's width wider than the
         space available - a horizontal scrollbar on the very first paint,
         before the app has even booted. */
      inset: 0;
      background: #032202;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      z-index: 9999;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(237, 162, 3, 0.2);
      border-top-color: #EDA203;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.25rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="header-mount"></div>

  <main class="main-wrapper" id="app">
    <!-- The one real <h1> for a crawler reading the shell before JavaScript
         runs. Bing's URL Inspection flagged "H1 tag missing" - the only
         heading in the un-rendered page was the "Loading..." h2 and an h1
         inside <noscript>, which crawlers do not count. Visually hidden (not
         display:none, which crawlers discount) so it does not disturb the
         splash; the app clears #app on boot and renders its own headings, so
         this exists only for the pre-JS view Bing actually indexed. -->
    <h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Kigali Market - Buy and Sell Products and Property in Rwanda</h1>
    <div id="app-loading">
      <div class="spinner"></div>
      <h2 style="font-weight: 700; letter-spacing: -0.02em;">Loading KIGALI MARKET PLATFORM...</h2>
      <p style="font-size: 0.88rem; color: #F4EDE2; margin-top: 0.25rem;">Connecting Kigali Marketplace & Gasabo Real Estate (kigalimarket.com)</p>
    </div>

    <!-- Real, indexable content for anything that reads the page without
         running JavaScript. The app replaces #app the moment it boots, so a
         normal visitor never sees this; a crawler that does not execute JS,
         or executes it late, gets a genuine description of the site instead
         of the "Loading..." splash above - which was the only body text the
         homepage offered a crawler before. -->
    <noscript>
      <div style="max-width: 780px; margin: 0 auto; padding: 2rem 1.25rem; font-family: sans-serif; color: #111;">
        <h1>Kigali Market - Buy &amp; Sell in Rwanda</h1>
        <p>Kigali Market (kigalimarket.com) is Rwanda's online marketplace. Buy and
           sell products, vehicles, electronics, fashion, furniture and more, or
           post your own free advertisement to reach buyers across all 30 districts.</p>
        <h2>Gasabo Real Estate</h2>
        <p>Browse houses, plots and commercial property for sale and rent through
           the Gasabo Real Estate portal.</p>
        <p>This site works best with JavaScript enabled. Please enable JavaScript,
           or contact us at 0788350555.</p>
      </div>
    </noscript>
  </main>

  <script>
    // Safety net, deliberately NOT inside main.js: if the module script below
    // fails to load/parse/execute for any reason (dropped connection, dev
    // server mid-restart, a bad deploy), #app-loading previously just sat
    // there forever with no error and no way out except a manual hard
    // refresh - exactly the "stuck for 10 minutes" symptom, with no signal
    // to the user that anything had gone wrong. main.js normally replaces
    // #app's content (and so this loader) within milliseconds of executing,
    // so if it's STILL here after a generous 12s, something upstream of the
    // app's own JS never ran at all.
    setTimeout(function () {
      var loader = document.getElementById('app-loading');
      if (!loader) return; // app already mounted - nothing to do
      loader.innerHTML =
        '<h2 style="font-weight:700;letter-spacing:-0.02em;">This is taking longer than expected</h2>' +
        '<p style="font-size:0.88rem;color:#F4EDE2;margin-top:0.5rem;max-width:420px;text-align:center;">' +
        'The app didn\'t finish loading. This is usually a dropped connection, not your device.</p>' +
        '<button onclick="window.location.reload()" style="margin-top:1.25rem;background:#EDA203;color:#000;font-weight:700;border:none;border-radius:10px;padding:0.7rem 1.5rem;font-size:0.95rem;cursor:pointer;">Reload</button>';
    }, 12000);
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
